name: Test e build candidato
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Dipendenze native
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-lato libegl1 libopengl0 libpulse0 libpulse-mainloop-glib0 libxcb-xinerama0 libxcb-cursor0 cups-client libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-tools
      - name: Ambiente Python vincolato
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r constraints-release.txt
          .venv/bin/python -m pip install --no-deps --no-build-isolation --editable .
      - name: Test e sintassi shell
        run: |
          .venv/bin/python -m unittest discover -s tests -v
          for script in build.sh build_deb.sh packaging/build_rpm.sh tools/check_audio_runtime.sh; do
            bash -n "$script"
          done
      - name: Genera il manuale per la versione del codice
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
        run: .venv/bin/python tools/generate_manual.py
      - name: Build candidato su tag o richiesta manuale
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get install -y rpm binutils
          bash build.sh
          rpm -qp --scripts dist/rpm/*.rpm
          dpkg-deb --info dist/debroot/*.deb
          rpm -qpl dist/rpm/*.rpm | grep -Fx /opt/qc-inspector/Manuale_operativo_QC_Inspector.pdf
      - name: Verifica installazione su Debian 13
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          docker run --rm -v "$PWD/dist/debroot:/packages:ro" debian:13 sh -ec '
            apt-get update
            apt-get install -y /packages/*.deb
            test -x /usr/bin/qc-inspector
            test -f /opt/qc-inspector/Manuale_operativo_QC_Inspector.pdf
            getent group qc-inspector
          '
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: qc-inspector-candidate
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/Manuale_operativo_QC_Inspector.pdf
            dist/debroot/*.deb
            dist/debroot/*.sha256
            dist/rpm/*.rpm
            dist/rpm/*.sha256
          if-no-files-found: error
