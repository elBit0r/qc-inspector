name: Test e build candidato
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Dipendenze native
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libpulse0 libxcb-xinerama0 libxcb-cursor0 cups-client libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-tools
      - name: Ambiente Python vincolato
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r constraints-release.txt
          .venv/bin/python -m pip install --no-deps --no-build-isolation --editable .
      - name: Test e sintassi shell
        run: |
          .venv/bin/python -m unittest discover -s tests -v
          bash -n build.sh build_deb.sh tools/check_audio_runtime.sh
      - name: Build candidato su tag o richiesta manuale
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: bash build_deb.sh
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: qc-inspector-candidate
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/debroot/*.deb
            dist/debroot/*.sha256
          if-no-files-found: error
